name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The root "prepare" script would otherwise write git hooks into the runner's checkout.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        # Git Bash on Windows, bash elsewhere: one syntax for every runner.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Must run before setup-node: `cache: pnpm` calls `pnpm store path`.
      # The pnpm version comes from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Assemble the landing page
        run: pnpm run site:build

      # --with-deps installs system packages on Linux and Windows Server; it is a no-op on macOS.
      - name: Install Playwright Chromium
        run: pnpm --filter @rhizom/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: rhizom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name rhizom -p 3737:3737 rhizom:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3737/api/health && break
            sleep 1
          done
          echo
          docker logs rhizom
          curl -sf http://127.0.0.1:3737/api/health | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3737/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3737/notes/does-not-exist)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3737/api/nope)" = 404
          docker rm -f rhizom
