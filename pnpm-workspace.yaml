# pnpm 12: every pnpm setting lives in this file (.npmrc is only read for auth and registry).
# Keys must be documented camelCase names; with packageManager pinned, an unknown key fails
# the install with ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS.

packages:
  - packages/*
  - apps/*

# Dependency build scripts are blocked until reviewed (strictDepBuilds defaults to true), so
# every package with an install script needs a decision here. Change decisions with
# `pnpm approve-builds <pkg>` or `pnpm approve-builds '!<pkg>'`.
allowBuilds:
  # ships prebuilt binaries for win32/darwin/linux (x64 + arm64, glibc + musl); never compile
  better-sqlite3: false
  # postinstall "node install.js" — pulled in by tsx
  esbuild: true
  # its postinstall is not needed: the root "prepare" script installs the git hooks
  simple-git-hooks: false

# One version per shared dependency; workspace packages reference it with "catalog:".
# strict: `pnpm add` must use the catalog version, so the packages cannot drift apart.
catalogMode: strict
catalog:
  '@codemirror/autocomplete': ^6.20.3
  '@codemirror/commands': ^6.11.1
  '@codemirror/lang-markdown': ^6.5.2
  '@codemirror/language': ^6.12.4
  '@codemirror/search': ^6.7.2
  '@codemirror/state': ^6.7.5
  '@codemirror/view': ^6.43.12
  '@fastify/multipart': ^10.1.1
  '@fastify/sensible': ^6.0.5
  '@fastify/static': ^10.1.4
  '@fastify/swagger': ^9.8.1
  '@fastify/swagger-ui': ^6.1.1
  '@fastify/type-provider-typebox': ^6.1.0
  '@lezer/common': ^1.5.2
  '@lezer/highlight': ^1.2.3
  '@lezer/markdown': ^1.7.2
  '@playwright/test': ^1.63.0
  '@sinclair/typebox': ^0.34.52
  '@types/better-sqlite3': ^9.6.0
  '@types/d3-force': ^3.0.10
  '@types/d3-quadtree': ^3.0.6
  '@types/hast': ^3.0.5
  '@types/mdast': ^4.0.4
  '@types/node': ^22.20.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  # @vitest/coverage-v8 peer-depends on the exact vitest version: bump both together
  '@vitest/coverage-v8': 5.0.1
  better-sqlite3: ^13.0.3
  chokidar: ^5.0.0
  d3-force: ^3.0.0
  d3-quadtree: ^3.0.1
  drizzle-orm: ^0.45.2
  fastify: ^5.12.5
  github-slugger: ^2.0.0
  i18next: ^26.4.2
  mdast-util-from-markdown: ^2.0.3
  mdast-util-to-string: ^4.0.0
  micromark-util-symbol: ^2.0.1
  micromark-util-types: ^2.0.2
  pino-pretty: ^13.1.3
  react: ^19.3.0
  react-dom: ^19.3.0
  react-i18next: ^17.0.14
  react-router: ^8.4.0
  rehype-sanitize: ^6.0.0
  rehype-stringify: ^10.0.1
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-parse: ^11.0.0
  remark-rehype: ^11.1.2
  tsx: ^4.23.13
  # typescript-eslint 8.70 supports TypeScript <6.1; TypeScript 7 ships no compiler API yet
  typescript: ~6.0.3
  unified: ^11.0.5
  unist-util-visit: ^5.1.0
  vite: ^8.3.0
  vitest: 5.0.1
  yaml: ^2.9.1
  zustand: ^5.0.15
minimumReleaseAgeExclude:
